<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>English Output Trainer</title>

    <link rel="stylesheet"
          th:href="@{/css/study.css}">

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>

<div class="container text-center">

    <h1>通常学習</h1>
    <p>頑張りましょう</p>

    <!--
    旧実装（Page<Question>時代）
    <div th:each="question : ${question}" class="mt-3">

    現在はControllerで
    Question question = questions.get(page);

    model.addAttribute("question", question);

    としているので、questionは1件のQuestionオブジェクト。
    そのためth:eachは不要。
    -->
    <div class="mt-3">

        <!--
        旧実装
        <span th:text="${page.number + 1 + '/' + page.totalPages}">
        -->

        <span th:text="${currentPage + '/' + totalPages}">
            現在の問題数/総問題数
        </span>

        <h2 th:text="${question.japaneseText}">
            日本語問題
        </h2>

        <p th:if="${question.condition != null}">
            条件：
            <span th:text="${question.condition}">
                条件
            </span>
        </p>

        <div style="min-height:80px;">

            <button id="answerButton"
                    type="button"
                    onclick="showAnswer()">
                解答を見る
            </button>

            <div id="answerArea" style="display:none;">
                解答：
                <span th:text="${question.englishText}">
                    English Answer
                </span>
            </div>

        </div>

    </div>

    <!-- 前へ・次へ -->
    <div class="mt-3">

        <!--
        旧実装
        th:if="${page.hasPrevious()}"
        th:href="@{/study(page=${page.number - 1},size=1)}"
        -->

        <a th:if="${hasPrevious}"
           th:href="@{/study(page=${currentPage - 2})}"
           class="btn btn-primary">
            前の問題へ
        </a>

        <!--
        旧実装
        th:if="${page.hasNext()}"
        th:href="@{/study(page=${page.number + 1},size=1)}"
        -->

        <a th:if="${hasNext}"
           th:href="@{/study(page=${currentPage})}"
           class="btn btn-primary">
            次の問題へ
        </a>

        <!--
        旧実装
        th:if="${!page.hasNext()}"
        -->

        <a th:if="${!hasNext}"
           th:href="@{/complete}"
           class="btn btn-success">
            Complete
        </a>

    </div>

    <!-- 学習終了 -->
    <div class="mt-3">

        <a th:href="@{/}"
           class="btn btn-danger">
            やめる
        </a>

    </div>

</div>

<script>

    function showAnswer() {

        document.getElementById("answerButton")
                .style.display = "none";

        document.getElementById("answerArea")
                .style.display = "block";

    }

</script>

</body>
</html>
