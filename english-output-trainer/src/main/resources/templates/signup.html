<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>English Output Trainer</title>
    <link rel="stylesheet"
          th:href="@{/css/study.css}">
    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}" defer></script>
    <title th:text="#{signup.title}"></title>
</head>
<body>

	<div class="container mt-5" layout:fragment="content">
	    <div class="row justify-content-center">
	        <div class="col-md-6 col-lg-4">
	            <form method="post" th:action="@{/signup}">
	                <h2 class="text-center mb-4" th:text="#{signup.title}">新規登録</h2>
			        <!-- ユーザーID -->
			        <div class="form-group">
			            <label for="userId" th:text="#{userId}">ユーザーID</label>
			            <input type="text" id="userId" class="form-control">
			        </div>
			        <!-- パスワード -->
			        <div class="form-group">
			            <label for="password" th:text="#{password}">パスワード</label>
			            <input type="text" id="password" class="form-control">
			        </div>
			        <div class="form-group">
			            <label for="password" th:text="#{confirm.password}">パスワード(確認)</label>
			            <input type="text" id="confirm-password" class="form-control">
			        </div>	
			        <!-- 登録ボタン -->
			        <input type="submit" th:value="#{signup.btn}"
			            class="btn btn-primary w-100 mt-4">
			        <div class="text-center mt-2">
			            <a th:href="@{/login}" th:text="#{login.link}">ログインはこちら</a>
			        </div>			        		        
	            </form>
	        </div>
	    </div>
	</div>
</body>
</html>
