<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title>English Output Trainer</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
	<div layout:fragment="content" class="container text-center mt-5">
	
	    <h1 class="mb-3">English Output Trainer</h1>
	
	    <p class="text-muted mb-5">
	        英作文トレーニングアプリへようこそ
	    </p>
	
	    <div class="d-grid gap-3 col-md-4 mx-auto">
	
	        <!-- 通常学習 -->
	        <a th:href="@{/study/menu}"
	           class="btn btn-primary btn-lg">
	            通常学習
	        </a>
	
	        <!-- 復習（ログイン時のみ） -->
	        <a sec:authorize="isAuthenticated()"
	           th:href="@{/review/menu}"
	           class="btn btn-success btn-lg">
	            復習
	        </a>
	
	        <!-- メニュー（ログイン時のみ） -->
	        <a sec:authorize="isAuthenticated()"
	           th:href="@{/menu}"
	           class="btn btn-secondary btn-lg">
	            メニュー
	        </a>
	
	        <!-- ログイン（未ログイン時のみ） -->
	        <a sec:authorize="isAnonymous()"
	           th:href="@{/login}"
	           class="btn btn-outline-primary btn-lg">
	            ログイン
	        </a>
	
	        <!-- 新規登録（未ログイン時のみ） -->
	        <a sec:authorize="isAnonymous()"
	           th:href="@{/signup/signup}"
	           class="btn btn-outline-success btn-lg">
	            新規登録
	        </a>
	
	    </div>
	
	</div>

</body>
</html>
