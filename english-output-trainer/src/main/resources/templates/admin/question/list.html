<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
	<meta charset="UTF-8">
    <title>問題管理</title>
    <link rel="stylesheet" th:href="@{/css/study.css}">
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div layout:fragment="content">

    <div class="container mt-4">

        <!-- タイトル・追加ボタン -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="mb-0">
                <i class="bi bi-list-ul"></i>
                問題一覧
            </h2>

            <a th:href="@{/admin/question/add}"
               class="btn btn-success">

                <i class="bi bi-plus-circle"></i>
                問題追加

            </a>

        </div>
        
		<!-- ========================= -->
		<!-- 検索フォーム -->
		<!-- ========================= -->
		<form th:action="@{/admin/question/search}"
		      method="get"
		      class="card p-3 mb-3">
		
		    <div class="row g-3 align-items-end">
		
		        <!-- 難易度 -->
		        <div class="col-md-4">
		            <label class="form-label fw-bold">
		                難易度
		            </label>
		
		            <div class="d-flex gap-3">
		
		                <div class="form-check">
		                    <input class="form-check-input"
		                           type="checkbox"
		                           name="difficulties"
		                           value="BEGINNER"
		                           id="beginner"
		                           th:checked="${selectedDifficulties != null and selectedDifficulties.contains(T(com.example.demo.entity.Difficulty).BEGINNER)}">
		
		                    <label class="form-check-label"
		                           for="beginner">
		                        初級
		                    </label>
		                </div>
		
		                <div class="form-check">
		                    <input class="form-check-input"
		                           type="checkbox"
		                           name="difficulties"
		                           value="INTERMEDIATE"
		                           id="intermediate"
		                           th:checked="${selectedDifficulties != null and selectedDifficulties.contains(T(com.example.demo.entity.Difficulty).INTERMEDIATE)}">
		
		                    <label class="form-check-label"
		                           for="intermediate">
		                        中級
		                    </label>
		                </div>
		
		                <div class="form-check">
		                    <input class="form-check-input"
		                           type="checkbox"
		                           name="difficulties"
		                           value="ADVANCED"
		                           id="advanced"
		                           th:checked="${selectedDifficulties != null and selectedDifficulties.contains(T(com.example.demo.entity.Difficulty).ADVANCED)}">
		
		                    <label class="form-check-label"
		                           for="advanced">
		                        上級
		                    </label>
		                </div>
		
		            </div>
		        </div>
		
		        <!-- Condition -->
		        <div class="col-md-3">
		
		            <label class="form-label fw-bold">
		                条件
		            </label>
		
		            <select class="form-select"
		                    name="conditions">
		
		                <option value="">
		                    すべて
		                </option>
		
		                <option th:each="condition : ${conditions}"
		                        th:value="${condition}"
		                        th:text="${condition}"
		                        th:selected="${condition == selectedConditions}">
		                </option>
		
		            </select>
		
		        </div>
		
		        <!-- キーワード -->
		        <div class="col-md-3">
		
		            <label class="form-label fw-bold">
		                キーワード
		            </label>
		
		            <input class="form-control"
		                   type="text"
		                   name="keyword"
		                   placeholder="日本語・英語・別解"
		                   th:value="${keyword}">
		
		        </div>
		
		        <!-- ボタン -->
		        <div class="col-md-2 d-grid">
		
		            <button class="btn btn-primary"
		                    type="submit">
		
		                <i class="bi bi-search"></i>
		
		                検索
		
		            </button>
		
		        </div>
		
		    </div>
		
		</form>

        <!-- 問題一覧 -->
		<div class="card">
		
		    <div class="table-responsive">
		
		        <table class="table table-hover align-middle mb-0">
		
		            <thead class="table-dark">
		
		                <tr>
		
		                    <th style="width:70px;">ID</th>
		
		                    <th style="width:26%;">日本語</th>
		
		                    <th>英語</th>
		
		                    <th style="width:90px;">難易度</th>
		
		                    <th style="width:120px;">詳細/編集</th>
		
		                    <th style="width:90px;">削除</th>
		
		                </tr>
		
		            </thead>
		
		            <tbody>
		
		                <tr th:each="question : ${questionList}"
		
		                    th:classappend="
		                        ${question.difficulty.name() == 'BEGINNER'} ? 'table-danger' :
		                        (${question.difficulty.name() == 'INTERMEDIATE'} ? 'table-primary' :
		                        'table-success')">
		
		                    <!-- ID -->
		                    <td th:text="${question.questionId}"></td>
		
		                    <!-- 日本語 -->
		                    <td>
		
		                        <span th:text="${
		                            #strings.length(question.japaneseText) > 25 ?
		                            #strings.substring(question.japaneseText,0,25) + '...' :
		                            question.japaneseText
		                        }"></span>
		
		                    </td>
		
		                    <!-- 英語 -->
		                    <td>
		
		                        <span th:text="${
		                            #strings.length(question.englishText) > 70 ?
		                            #strings.substring(question.englishText,0,70) + '...' :
		                            question.englishText
		                        }"></span>
		
		                    </td>
		
		                    <!-- 難易度 -->
		                    <td>
		
		                        <span
		                            th:if="${question.difficulty.name()=='BEGINNER'}"
		                            class="fw-bold text-danger">
		                            初級
		                        </span>
		
		                        <span
		                            th:if="${question.difficulty.name()=='INTERMEDIATE'}"
		                            class="fw-bold text-primary">
		                            中級
		                        </span>
		
		                        <span
		                            th:if="${question.difficulty.name()=='ADVANCED'}"
		                            class="fw-bold text-success">
		                            上級
		                        </span>
		
		                    </td>
		
		                    <!-- 詳細・編集 -->
		                    <td>
		
		                        <a class="btn btn-outline-primary btn-sm"
		                           th:href="@{/admin/question/edit(questionId=${question.questionId})}">
		
		                            <i class="bi bi-pencil-square"></i>
		
		                        </a>
		
		                    </td>
		
		                    <!-- 削除 -->
		                    <td>
		
								<form th:action="@{/admin/question/delete}" method="post">
								    <input type="hidden"
								           name="questionId"
								           th:value="${question.questionId}">
								
								    <button type="submit"
								            class="btn btn-outline-danger btn-sm"
								            title="削除"
								            onclick="return confirm('この問題を削除しますか？');">
								        <i class="bi bi-trash"></i>
								    </button>
								</form>
		
		                    </td>
		
		                </tr>
		
		            </tbody>
		
		        </table>
		
		    </div>
		
		</div>

		<!-- ページネーション -->
		<nav class="mt-4">
		
		    <ul class="pagination justify-content-center">
		
		        <!-- 前へ -->
		        <li class="page-item"
		            th:classappend="${page.first} ? ' disabled'">
		
		            <a class="page-link"
		               th:href="@{/admin/question/search(
		                    page=${page.number-1},
		                    size=${page.size},
		                    difficulties=${selectedDifficulties},
		                    conditions=${selectedConditions},
		                    keyword=${keyword}
		               )}">
		
		                前へ
		
		            </a>
		
		        </li>
		
		        <!-- 1ページ目 -->
		        <li class="page-item"
		            th:classappend="${page.number == 0} ? ' active'">
		
		            <a class="page-link"
		               th:href="@{/admin/question/search(
		                    page=0,
		                    size=${page.size},
		                    difficulties=${selectedDifficulties},
		                    conditions=${selectedConditions},
		                    keyword=${keyword}
		               )}">
		
		                1
		
		            </a>
		
		        </li>
		
		        <!-- ... (先頭側) -->
		        <li class="page-item disabled"
		            th:if="${pagination.showFirstEllipsis}">
		
		            <span class="page-link">...</span>
		
		        </li>
		
		        <!-- 中央のページ番号 -->
		        <li class="page-item"
		            th:each="i : ${#numbers.sequence(pagination.displayStartPage, pagination.displayEndPage)}"
		            th:if="${i != 0 and i != page.totalPages - 1}"
		            th:classappend="${i == pagination.currentPage} ? ' active'">
		
		            <a class="page-link"
		               th:href="@{/admin/question/search(
		                    page=${i},
		                    size=${page.size},
		                    difficulties=${selectedDifficulties},
		                    conditions=${selectedConditions},
		                    keyword=${keyword}
		               )}"
		               th:text="${i + 1}">
		
		            </a>
		
		        </li>
		
		        <!-- ... (末尾側) -->
		        <li class="page-item disabled"
		            th:if="${pagination.showLastEllipsis}">
		
		            <span class="page-link">...</span>
		
		        </li>
		
		        <!-- 最終ページ -->
		        <li class="page-item"
		            th:if="${page.totalPages > 1}"
		            th:classappend="${page.last} ? ' active'">
		
		            <a class="page-link"
		               th:href="@{/admin/question/search(
		                    page=${page.totalPages-1},
		                    size=${page.size},
		                    difficulties=${selectedDifficulties},
		                    conditions=${selectedConditions},
		                    keyword=${keyword}
		               )}"
		               th:text="${page.totalPages}">
		
		            </a>
		
		        </li>
		
		        <!-- 次へ -->
		        <li class="page-item"
		            th:classappend="${page.last} ? ' disabled'">
		
		            <a class="page-link"
		               th:href="@{/admin/question/search(
		                    page=${page.number+1},
		                    size=${page.size},
		                    difficulties=${selectedDifficulties},
		                    conditions=${selectedConditions},
		                    keyword=${keyword}
		               )}">
		
		                次へ
		
		            </a>
		
		        </li>
		
		    </ul>
		
		</nav>
    </div>

</div>

</body>
</html>
