<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>問題登録</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container mt-4">

        <h2 class="mb-4">
            <i class="bi bi-plus-circle"></i>
            問題登録
        </h2>

        <div class="card">

            <div class="card-body">

                <form th:action="@{/admin/question/add}"
                      th:object="${questionForm}"
                      method="post">

                    <!-- 日本語 -->
                    <div class="mb-3">
                        <label class="form-label">
                            日本語
                        </label>

                        <textarea
                            th:field="*{japaneseText}"
                            class="form-control"
                            rows="3"
                            required>
                        </textarea>
                        
                        <div class="text-danger mt-1"
						     th:if="${#fields.hasErrors('japaneseText')}"
						     th:errors="*{japaneseText}">
						</div>
                    </div>

                    <!-- 英語 -->
                    <div class="mb-3">
                        <label class="form-label">
                            英語
                        </label>

                        <textarea
                            th:field="*{englishText}"
                            class="form-control"
                            rows="3"
                            required>
                        </textarea>
                        
						<div class="text-danger mt-1"
						     th:if="${#fields.hasErrors('englishText')}"
						     th:errors="*{englishText}">
						</div>                        
                    </div>

                    <!-- 別解 -->
                    <div class="mb-3">
                        <label class="form-label">
                            別解
                        </label>

                        <textarea
                            th:field="*{alternativeAnswer}"
                            class="form-control"
                            rows="2">
                        </textarea>
						<div class="text-danger mt-1"
						     th:if="${#fields.hasErrors('alternativeAnswer')}"
						     th:errors="*{alternativeAnswer}">
						</div>                        
                    </div>

                    <!-- 条件 -->
                    <div class="mb-3">
                        <label class="form-label">
                            条件
                        </label>

                        <input
                            type="text"
                            th:field="*{condition}"
                            class="form-control">
						<div class="text-danger mt-1"
						     th:if="${#fields.hasErrors('condition')}"
						     th:errors="*{condition}">
						</div>                        
                    </div>

                    <!-- 難易度 -->
                    <div class="mb-4">

                        <label class="form-label">
                            難易度
                        </label>

                        <select
                            th:field="*{difficulty}"
                            class="form-select">

                            <option value="">
                                選択してください
                            </option>

                            <option
                                th:each="difficulty : ${T(com.example.demo.entity.Difficulty).values()}"
                                th:value="${difficulty}"
                                th:text="${difficulty}">
                            </option>

                        </select>
						<div class="text-danger mt-1"
						     th:if="${#fields.hasErrors('difficulty')}"
						     th:errors="*{difficulty}">
						</div>                        

                    </div>

                    <!-- ボタン -->
                    <div class="text-center mt-3 mb-3">

                        <button
                            type="submit"
                            class="btn btn-primary">

                            <i class="bi bi-check-circle"></i>
                            登録

                        </button>

                        <a
                            th:href="@{/admin/menu}"
                            class="btn btn-secondary ms-2">

                            adminメニューに戻る

                        </a>

                    </div>

                </form>

            </div>
            
            

        </div>

    </div>

</div>

</body>
</html>
