<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title>English Output Trainer</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <script th:src="@{/js/review.js}" defer></script>
</head>

<body>

<div layout:fragment="content">
	
	<div class="header border-bottom pb-2 mb-2 d-flex justify-content-between align-items-center">
	
	    <h1 class="h2 mb-0">
	        <i class="bi bi-arrow-repeat me-2 text-primary"></i>
	        復習
	    </h1>
	
		<div th:if="${canResume}"
		     class="d-flex align-items-center gap-3">
		
		    <span class="text-danger fw-bold">
		        中断しているトレーニングがあります
		        (<span th:text="${currentPage + 1}"></span>
		        /
		        <span th:text="${totalCount}"></span>)
		    </span>
		
		    <a th:href="@{/review/resume}"
		       class="btn btn-warning">
		        再開する
		    </a>
		
		</div>
	
	</div>
    <form th:action="@{/review/start}" method="get">
		<div class="row">

	        <!-- 出題方法 -->
	        <div class="col-md-6 mb-4">
				
				<div class="card">
	
		            <div class="card-header">
		                出題方法
		            </div>
		
		            <div class="card-body">
		
		                <div class="form-check">
		                    <input class="form-check-input"
		                           type="radio"
		                           name="order"
		                           value="SEQUENTIAL"
		                           checked>
		
		                    <label class="form-check-label">
		                        順番に出題
		                    </label>
		                </div>
		
		                <div class="form-check">
		                    <input class="form-check-input"
		                           type="radio"
		                           name="order"
		                           value="RANDOM">
		
		                    <label class="form-check-label">
		                        ランダムに出題
		                    </label>
		                </div>
		
		            </div>
		            
		    	</div>
	
	        </div>
	
	        <!-- 評価 -->
	        <div class="col-md-6 mb-4">
				
				<div class="card">
	
		            <div class="card-header">
		                理解度
		            </div>
		
		            <div class="card-body">
		
		                <div class="row">
		
		                    <div class="col text-center">
		
		                        <div class="form-check">
		                            <input class="form-check-input"
		                                   type="checkbox"
		                                   name="evaluations"
		                                   value="HARD">
					    			<label class="form-check-label">
			    						<span class="fw-bold text-danger">Hard</span><br>
			    						<small class="text-danger">
			        						難しい・わからない
			    						</small>
								    </label>		                            
		                        </div>
		
		                    </div>
		
		                    <div class="col text-center">
		
		                        <div class="form-check">
		                            <input class="form-check-input"
		                                   type="checkbox"
		                                   name="evaluations"
		                                   value="GOOD">
					    			<label class="form-check-label">
			    						<span class="fw-bold text-primary">Hard</span><br>
			    						<small class="text-primary">
			        						少し考えた、一部正解だった
			    						</small>
								    </label>
		                        </div>
		
		                    </div>
		
		                    <div class="col text-center">
		
		                        <div class="form-check">
		                            <input class="form-check-input"
		                                   type="checkbox"
		                                   name="evaluations"
		                                   value="EASY">

					                <label class="form-check-label">
			    						<span class="fw-bold text-success">Hard</span><br>
			    						<small class="text-success">
			        						簡単だった
			    						</small>
								    </label>
		                        </div>
		
		                    </div>
		
		                </div>
		
		            </div>
		            
		    	</div>
	
	        </div>
	
	        <!-- 問題難易度 -->
			<div class="col-md-6 mb-4">
			
			    <div class="card">
			
			        <div class="card-header">
			            問題難易度
			        </div>
			
			        <div class="card-body">
			
			            <div class="d-flex gap-3">
			
			                <label class="bg-danger-subtle rounded px-3 py-2">
			                    <input class="form-check-input me-2"
			                           type="checkbox"
			                           name="difficulties"
			                           value="BEGINNER">
			                    <span class="fw-bold text-danger">
			                        初級
			                    </span>
			                </label>
			
			                <label class="bg-primary-subtle rounded px-3 py-2">
			                    <input class="form-check-input me-2"
			                           type="checkbox"
			                           name="difficulties"
			                           value="INTERMEDIATE">
			                    <span class="fw-bold text-primary">
			                        中級
			                    </span>
			                </label>
			
			                <label class="bg-success-subtle rounded px-3 py-2">
			                    <input class="form-check-input me-2"
			                           type="checkbox"
			                           name="difficulties"
			                           value="ADVANCED">
			                    <span class="fw-bold text-success">
			                        上級
			                    </span>
			                </label>
			
			            </div>
			
			        </div>
			
			    </div>
			
			</div>
			<!-- お気に入り -->
			<div class="col-md-6 mb-4">
				
				<div class="card">
			
				    <div class="card-header">
				        お気に入り
				    </div>
				
				    <div class="card-body">
				
				        <div class="form-check mb-2">
				            <input class="form-check-input"
				                   type="radio"
				                   name="favoriteCondition"
				                   value="FAVORITED">
				
				            <label class="form-check-label">
				                お気に入り登録した問題のみ出題
				            </label>
				        </div>
				
				        <div class="form-check mb-2">
				            <input class="form-check-input"
				                   type="radio"
				                   name="favoriteCondition"
				                   value="NOT_FAVORITED">
				
				            <label class="form-check-label">
				                お気に入り登録していない問題のみ出題
				            </label>
				        </div>
				        
				        <div class="form-check">
				            <input class="form-check-input"
				                   type="radio"
				                   name="favoriteCondition"
				                   value="ALL"
				                   checked>
				
				            <label class="form-check-label">
				                どちらも出題する
				            </label>
				        </div>
				
				    </div>
				    
				</div>
			
			</div>
		</div>
        <!-- 出題数 -->
        <div class="text-center mb-4">

            <div class="text-secondary mb-2">
                出題数
            </div>

            <h2 class="fw-bold"
                id="countReviewQuestions">
                -
            </h2>

        </div>

        <!-- 出題開始 -->
		<div class="text-center mt-4">
		    <button type="submit"
		            class="btn btn-primary btn-lg px-5">
		        出題開始
		    </button>
		</div>

    </form>

</div>

</body>
</html>
