<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title>English Output Trainer</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script th:src="@{/js/study-menu.js}" defer></script>
</head>

<body>

<div layout:fragment="content">

	<div class="header border-bottom pb-2 mb-2 d-flex justify-content-between align-items-center">
	
	    <h1 class="h2 mb-0">
	        <i class="bi bi-chat-dots me-2 text-primary"></i>
	        英作文トレーニング
	    </h1>
	
		<div th:if="${canResume}"
		     class="d-flex align-items-center gap-3">
		
		    <span class="text-danger fw-bold">
		        中断しているトレーニングがあります
		        (<span th:text="${currentPage + 1}"></span>
		        /
		        <span th:text="${totalCount}"></span>)
		    </span>
		
		    <a th:href="@{/study/resume}"
		       class="btn btn-warning">
		        再開する
		    </a>
		
		</div>
	
	</div>

    <form th:action="@{/study/start}" method="get">
		
		<div class="card mb-3">
    		<div class="card-body">
		
				<div class="d-flex align-items-center gap-3 mb-2">
				    <h3 class="mb-0">
						<i class="bi bi-list-ul me-2"></i>
						範囲を指定してトレーニング
					</h3>
				    <p class="mb-0 text-muted">難易度と出題範囲を選択して出題します。<p>
				</div>
			
				<!-- 出題方法 -->
				<div class="d-flex mb-3">
					
					<div class="card" style="width: 400px;">
					
					    <div class="card-header">
					        出題方法
					    </div>
					
					    <div class="card-body">
					
					        <div class="form-check">
					            <input class="form-check-input"
					                   type="radio"
					                   name="random"
					                   value="false"
					                   checked>
					
					            <label class="form-check-label">
					                順番に出題
					            </label>
					        </div>
					
					        <div class="form-check">
					            <input class="form-check-input"
					                   type="radio"
					                   name="random"
					                   value="true">
					
					            <label class="form-check-label">
					                ランダムに出題
					            </label>
					        </div>
					
					    </div>
					
					</div>
				
				</div>
		
				<!-- 問題難易度 -->
				<div class="row g-3 mb-3">
				
				    <!-- 初級 -->
				    <div class="col-md-4">
				        <div class="accordion" id="beginnerAccordion">
				
				            <div class="accordion-item">
				
				                <h2 class="accordion-header">
				
				                    <button class="accordion-button collapsed bg-danger-subtle fs-4 py-3"
				                            type="button"
				                            data-bs-toggle="collapse"
				                            data-bs-target="#beginnerCollapse">
				
				                        <span th:text="'初級 : ' + ${studyMenu.beginnerCount} + '問'"></span> 
				
				                    </button>
				
				                </h2>
				
				                <div id="beginnerCollapse"
				                     class="accordion-collapse collapse">
				
				                    <div class="accordion-body">
				
				                        <select id="beginnerRange"
				                        		class="form-select"
				                                name="beginnerRange">
				
				                            <option value="">選択してください</option>
				
				                            <option th:each="range : ${studyMenu.beginnerRanges}"
				                                    th:value="${range.start}"
				                                    th:text="${range.displayText}">
				                            </option>
				
				                        </select>
				
				                    </div>
				
				                </div>
				
				            </div>
				
				        </div>
				    </div>
				
				    <!-- 中級 -->
				    <div class="col-md-4">
				
				        <div class="accordion" id="intermediateAccordion">
				
				            <div class="accordion-item">
				
				                <h2 class="accordion-header">
				
				                    <button class="accordion-button collapsed bg-primary-subtle fs-4 py-3"
				                            type="button"
				                            data-bs-toggle="collapse"
				                            data-bs-target="#intermediateCollapse">
				
				                        <span th:text="'中級 : ' + ${studyMenu.intermediateCount} + '問'"></span>
				
				                    </button>
				
				                </h2>
				
				                <div id="intermediateCollapse"
				                     class="accordion-collapse collapse">
				
				                    <div class="accordion-body">
				
				                        <select id="intermediateRange"
				                        		class="form-select"
				                                name="intermediateRange">
				
				                            <option value="">選択してください</option>
				
				                            <option th:each="range : ${studyMenu.intermediateRanges}"
				                                    th:value="${range.start}"
				                                    th:text="${range.displayText}">
				                            </option>
				
				                        </select>
				
				                    </div>
				
				                </div>
				
				            </div>
				
				        </div>
				
				    </div>
				
				    <!-- 上級 -->
				    <div class="col-md-4">
				
				        <div class="accordion" id="advancedAccordion">
				
				            <div class="accordion-item">
				
				                <h2 class="accordion-header">
				
				                    <button class="accordion-button collapsed bg-success-subtle fs-4 py-3"
				                            type="button"
				                            data-bs-toggle="collapse"
				                            data-bs-target="#advancedCollapse">
				
				                        <span th:text="'上級 : ' + ${studyMenu.advancedCount} + '問'"></span>
				
				                    </button>
				
				                </h2>
				
				                <div id="advancedCollapse"
				                     class="accordion-collapse collapse">
				
				                    <div class="accordion-body">
				
				                        <select id="advancedRange"
				                        		class="form-select"
				                                name="advancedRange">
				
				                            <option value="">選択してください</option>
				
				                            <option th:each="range : ${studyMenu.advancedRanges}"
				                                    th:value="${range.start}"
				                                    th:text="${range.displayText}">
				                            </option>
				
				                        </select>
				
				                    </div>
				
				                </div>
				
				            </div>
				
				        </div>
				
				    </div>
				
				</div>
				
				<!-- エラーメッセージ -->
				<p th:if="${errorMessage}"
				   class="text-danger fw-bold mb-2 text-center"
				   th:text="${errorMessage}">
				</p>
		
				<!-- 出題開始 -->
				<div class="text-center mt-2">
					<button type="submit"
					        class="btn btn-primary btn-lg px-5">
					        出題開始
					</button>
				</div>
				
    		</div>
		</div>

    </form>
    
	<!-- 未学習トレーニング（ログインユーザーのみ） -->
	<div sec:authorize="isAuthenticated()" class="mt-3">
		
		<div class="card mb-3">
    		<div class="card-body">
	
			    <div class="d-flex align-items-center gap-3 mb-2">
				    <h3>
					    <i class="bi bi-stars me-2 text-primary"></i>
					    未学習の問題のみトレーニング
					</h3>
				    <p class="mb-0 text-muted">まだ学習していない問題のみを出題します。問題を難易度別に絞ることもできます。</p>
				</div>
			
			    <form th:action="@{/study/new/start}" method="get">
					
					<div class="d-flex gap-3 mb-3">
					
					    <label class="bg-danger-subtle rounded px-3 py-2">
					        <input class="form-check-input me-2"
					               type="checkbox"
					               name="difficulties"
					               value="BEGINNER">
					        初級 (<span th:text="${newQuestioncount.beginnerCount}">0</span>問)
					    </label>
					
					    <label class="bg-primary-subtle rounded px-3 py-2">
					        <input class="form-check-input me-2"
					               type="checkbox"
					               name="difficulties"
					               value="INTERMEDIATE">
					        中級 (<span th:text="${newQuestioncount.intermediateCount}">0</span>問)
					    </label>
					
					    <label class="bg-success-subtle rounded px-3 py-2">
					        <input class="form-check-input me-2"
					               type="checkbox"
					               name="difficulties"
					               value="ADVANCED">
					        上級 (<span th:text="${newQuestioncount.advancedCount}">0</span>問)
					    </label>
					
					</div>
					
					<div class="text-center">
					    <button type="submit"
					            class="btn btn-primary btn-lg px-5">
					        出題開始
					    </button>
					</div>
			
			    </form>
			    
    		</div>
		</div>
	
	</div>
	<!-- 未学習トレーニング（ゲストのみ） -->
	<div sec:authorize="isAnonymous()" class="mt-3">
		
		<div class="card mb-3">
    		<div class="card-body">
	
			    <div class="d-flex align-items-center gap-3 mb-2">
				    <h3>
					    <i class="bi bi-stars me-2 text-primary"></i>
					    未学習の問題のみトレーニング
					    <i class="bi bi-lock me-2 text-primary"></i>
					</h3>
				    <p class="mb-0 text-muted">
						まだ学習していない問題のみを出題します。
						    <span class="text-danger fw-bold">
						        ログイン後使用できます。
						    </span>
					</p>
				</div>
					
					<div class="d-flex gap-3 mb-3">
					
					    <label class="bg-danger-subtle rounded px-3 py-2 opacity-50">
					        <input class="form-check-input me-2"
					               type="checkbox" disabled>
					        		初級(--問)
					    </label>
					
					    <label class="bg-primary-subtle rounded px-3 py-2 opacity-50">
					        <input class="form-check-input me-2"
					               type="checkbox" disabled>
					        		中級(--問)
					    </label>
					
					    <label class="bg-success-subtle rounded px-3 py-2 opacity-50">
					        <input class="form-check-input me-2"
					               type="checkbox" disabled>
					        		中級(--問)
					    </label>
					
					</div>
					
					<div class="text-center">
					    <button type="button"
					            class="btn btn-primary btn-lg px-5 opacity-50"
					            disabled>
					        出題開始
					    </button>
					</div>
			    
    		</div>
		</div>
	
	</div>

</div>

</body>
</html>
