<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title>会員情報編集</title>
	<link rel="stylesheet" th:href="@{/css/study.css}">
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
	<script th:src="@{/js/study.js}" defer></script>
</head>
<body>
	<div layout:fragment="content">
		<div class="header border-bottom">
			<h1 class="h2">会員情報編集</h1>
			<!-- 一覧表示 -->
			<div>
				<form th:action="@{/user/edit}"
				      th:object="${editForm}"
				      method="post">
				
				    <table class="table table-striped table-bordered table-hover text-center align-items-center">
				
				        <thead>
				            <tr>
				                <th>ユーザーID</th>
				                <th></th>
				            </tr>
				        </thead>
				
				        <tbody>
				            <tr>
				                <td>
				                    <input type="text"
				                           th:field="*{userId}"
				                           th:errorclass="is-invalid"
				                           class="form-control">
				
				                    <div class="invalid-feedback"
				                         th:errors="*{userId}">
				                    </div>
				                </td>
				
				                <td class="text-center">
				                    <button type="submit"
				                            class="btn btn-primary">
				                        更新
				                    </button>
				                </td>
				            </tr>
				        </tbody>
				
				    </table>
				
				</form>
			</div>
		</div>
	</div>
</body>
</html>
