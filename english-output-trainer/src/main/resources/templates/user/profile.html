<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title>会員情報確認・編集</title>
	<link rel="stylesheet" th:href="@{/css/study.css}">
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
	<script th:src="@{/js/study.js}" defer></script>
</head>
<body>
	<div layout:fragment="content">
		<div class="header">
			<h1 class="h2">会員情報</h1>
			<!-- 一覧表示 -->
			<div class="d-flex flex-column align-items-center gap-2 mt-3">
				<table class="table table-striped table-bordered table-hover align-items-center">
				    <tr>
				        <th class="align-middle text-center">ユーザーID</th>
				        <td th:text="${user.userId}"
				        	class="align-middle"></td>
				        <td class="align-middle text-center">
				            <a th:href="@{/user/edit/userId}"
				               class="btn btn-primary">
				                編集
				            </a>
				        </td>
				    </tr>
				
				    <tr>
				        <th class="align-middle text-center">パスワード</th>
				        <td class="align-middle">************</td>
				        <td class="align-middle text-center" style="width:120px;">
				            <a th:href="@{/user/edit/password}"
				               class="btn btn-primary">
				                編集
				            </a>
				        </td>
				    </tr>
				</table>
				<div class="text-center mt-2 mb-2">
				    <a th:href="@{/user/menu}"
				       class="btn btn-secondary">
				        会員メニューに戻る
				    </a>
				</div>					
				<div>
					<form th:action="@{/user/delete}" method="post">
					    <button type="submit"
					            class="btn btn-danger"
					            onclick="return confirm('退会しますか？ 学習履歴は消去されます');">
					        退会する
					    </button>
					</form>
				</div>					
			</div>
		</div>
	</div>
</body>
</html>
