<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title>問題一覧</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div layout:fragment="content" class="w-100">

    <h2 class="mb-4">
        問題一覧
    </h2>

	<table class="table table-hover align-middle">
	
	    <thead class="table-dark">
	
	    <tr>
	        <th>問題番号</th>
		    <th style="width:30%;">日本語</th>
		    <th style="width:30%;">英語</th>
	        <th>難易度</th>
	        <th>詳細</th>
	        <th>理解度</th>
	        <th>お気に入り</th>
	    </tr>
	
	    </thead>
	
	    <tbody>
	
	    <tr th:each="question : ${questionList}">
	
	        <!-- 問題番号 -->
	        <td th:text="${question.questionId}">
	        </td>
	
	        <!-- 日本語 -->
	        <td th:text="${question.japaneseText}">
	        </td>
	
	        <!-- 英語 -->
	        <td th:text="${question.englishText}">
	        </td>
	
	        <!-- 難易度 -->
	        <td>
	
	            <span class="text-danger fw-bold"
	                  th:if="${question.difficulty.name() == 'BEGINNER'}">
	                初級
	            </span>
	
	            <span class="text-primary fw-bold"
	                  th:if="${question.difficulty.name() == 'INTERMEDIATE'}">
	                中級
	            </span>
	
	            <span class="text-success fw-bold"
	                  th:if="${question.difficulty.name() == 'ADVANCED'}">
	                上級
	            </span>
	
	        </td>
	
	        <!-- 詳細 -->
	        <td>
	
	            <button class="btn btn-outline-primary btn-sm">
	                詳細
	            </button>
	
	        </td>
	
			<!-- 理解度 -->
			<td>
			
			    <!-- 未学習 -->
			    <span th:if="${question.evaluation == null}"
			          class="text-secondary">
			        未学習
			    </span>
			
			    <!-- Hard -->
			    <button th:if="${question.evaluation == T(com.example.demo.entity.Evaluation).HARD}"
			            class="btn btn-sm btn-danger evaluationButton"
			            th:data-question-id="${question.questionId}"
			            data-evaluation="HARD">
			        Hard
			    </button>
			
			    <!-- Good -->
			    <button th:if="${question.evaluation == T(com.example.demo.entity.Evaluation).GOOD}"
			            class="btn btn-sm btn-primary evaluationButton"
			            th:data-question-id="${question.questionId}"
			            data-evaluation="GOOD">
			        Good
			    </button>
			
			    <!-- Easy -->
			    <button th:if="${question.evaluation == T(com.example.demo.entity.Evaluation).EASY}"
			            class="btn btn-sm btn-success evaluationButton"
			            th:data-question-id="${question.questionId}"
			            data-evaluation="EASY">
			        Easy
			    </button>
			
			</td>
	
	        <!-- お気に入り -->
	        <td class="text-center">
	
	            <button class="btn btn-link p-0 favoriteButton"
	                    th:data-question-id="${question.questionId}">
	
	                <i class="bi bi-heart-fill text-danger"
	                   th:if="${question.favorite}">
	                </i>
	
	                <i class="bi bi-heart"
	                   th:unless="${question.favorite}">
	                </i>
	
	            </button>
	
	        </td>
	
	    </tr>
	
	    </tbody>
	
	</table>

	<!-- ページネーション -->
	<nav class="mt-4">
	
	    <ul class="pagination justify-content-center">
	
	        <!-- 前へ -->
	        <li class="page-item"
	            th:classappend="${page.first} ? ' disabled'">
	
	            <a class="page-link"
	               th:href="@{/user/question/list(page=${page.number-1},size=${page.size})}">
	
	                前へ
	
	            </a>
	
	        </li>
	
	        <!-- 1ページ目 -->
	        <li class="page-item"
	            th:classappend="${page.number == 0} ? ' active'">
	
	            <a class="page-link"
	               th:href="@{/user/question/list(page=0,size=${page.size})}">
	
	                1
	
	            </a>
	
	        </li>
	
	        <!-- ... (先頭側) -->
	        <li class="page-item disabled"
	            th:if="${pagination.showFirstEllipsis}">
	
	            <span class="page-link">...</span>
	
	        </li>
	
	        <!-- 中央のページ番号 -->
	        <li class="page-item"
	            th:each="i : ${#numbers.sequence(pagination.displayStartPage, pagination.displayEndPage)}"
	            th:if="${i != 0 and i != page.totalPages - 1}"
	            th:classappend="${i == pagination.currentPage} ? ' active'">
	
	            <a class="page-link"
	               th:href="@{/user/question/list(page=${i},size=${page.size})}"
	               th:text="${i + 1}">
	
	            </a>
	
	        </li>
	
	        <!-- ... (末尾側) -->
	        <li class="page-item disabled"
	            th:if="${pagination.showLastEllipsis}">
	
	            <span class="page-link">...</span>
	
	        </li>
	
	        <!-- 最終ページ -->
	        <li class="page-item"
	            th:if="${page.totalPages > 1}"
	            th:classappend="${page.last} ? ' active'">
	
	            <a class="page-link"
	               th:href="@{/user/question/list(page=${page.totalPages-1},size=${page.size})}"
	               th:text="${page.totalPages}">
	
	            </a>
	
	        </li>
	
	        <!-- 次へ -->
	        <li class="page-item"
	            th:classappend="${page.last} ? ' disabled'">
	
	            <a class="page-link"
	               th:href="@{/user/question/list(page=${page.number+1},size=${page.size})}">
	
	                次へ
	
	            </a>
	
	        </li>
	
	    </ul>
	
	</nav>

</div>

</body>

</html>
