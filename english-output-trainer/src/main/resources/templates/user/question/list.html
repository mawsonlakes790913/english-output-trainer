<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title>問題一覧</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<script th:src="@{/js/user/question/list.js}"
	        defer>
	</script>
	
	<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}">
	</script>
	
	<meta name="_csrf"
	      th:content="${_csrf.token}">
	
	<meta name="_csrf_header"
	      th:content="${_csrf.headerName}">      
</head>

<body>

<div layout:fragment="content" class="w-100">

    <h2 class="mb-4">
        問題一覧
    </h2>
    
	<!-- ========================= -->
	<!-- 検索フォーム -->
	<!-- ========================= -->
	<form th:action="@{/user/question/search}"
	      method="get"
	      class="card p-3 mb-3">
	
	    <div class="row g-3">
	
	        <!-- ========================= -->
	        <!-- 難易度 -->
	        <!-- ========================= -->
	        <div class="col-md-12">
	
	            <label class="form-label fw-bold">
	                難易度
	            </label>
	
	            <div class="d-flex gap-3">
	
	                <div class="form-check">
	                    <input class="form-check-input"
	                           type="checkbox"
	                           name="difficulties"
	                           value="BEGINNER"
	                           id="beginner"
	                           th:checked="${selectedDifficulties != null and selectedDifficulties.contains(T(com.example.demo.entity.Difficulty).BEGINNER)}">
	
	                    <label class="form-check-label"
	                           for="beginner">
	                        初級
	                    </label>
	                </div>
	
	                <div class="form-check">
	                    <input class="form-check-input"
	                           type="checkbox"
	                           name="difficulties"
	                           value="INTERMEDIATE"
	                           id="intermediate"
	                           th:checked="${selectedDifficulties != null and selectedDifficulties.contains(T(com.example.demo.entity.Difficulty).INTERMEDIATE)}">
	
	                    <label class="form-check-label"
	                           for="intermediate">
	                        中級
	                    </label>
	                </div>
	
	                <div class="form-check">
	                    <input class="form-check-input"
	                           type="checkbox"
	                           name="difficulties"
	                           value="ADVANCED"
	                           id="advanced"
	                           th:checked="${selectedDifficulties != null and selectedDifficulties.contains(T(com.example.demo.entity.Difficulty).ADVANCED)}">
	
	                    <label class="form-check-label"
	                           for="advanced">
	                        上級
	                    </label>
	                </div>
	
	            </div>
	
	        </div>
	
	        <!-- ========================= -->
	        <!-- 理解度 -->
	        <!-- ========================= -->
	        <div class="col-md-12">
	
	            <label class="form-label fw-bold">
	                理解度
	            </label>
	
	            <div id="evaluationArea"
	                 class="d-flex gap-3">
	
	                <div class="form-check">
	                    <input class="form-check-input"
	                           type="checkbox"
	                           name="evaluations"
	                           value="HARD"
	                           id="hard"
	                           th:checked="${selectedEvaluations != null and selectedEvaluations.contains(T(com.example.demo.entity.Evaluation).HARD)}">
	
	                    <label class="form-check-label"
	                           for="hard">
	                        Hard
	                    </label>
	                </div>
	
	                <div class="form-check">
	                    <input class="form-check-input"
	                           type="checkbox"
	                           name="evaluations"
	                           value="GOOD"
	                           id="good"
	                           th:checked="${selectedEvaluations != null and selectedEvaluations.contains(T(com.example.demo.entity.Evaluation).GOOD)}">
	
	                    <label class="form-check-label"
	                           for="good">
	                        Good
	                    </label>
	                </div>
	
	                <div class="form-check">
	                    <input class="form-check-input"
	                           type="checkbox"
	                           name="evaluations"
	                           value="EASY"
	                           id="easy"
	                           th:checked="${selectedEvaluations != null and selectedEvaluations.contains(T(com.example.demo.entity.Evaluation).EASY)}">
	
	                    <label class="form-check-label"
	                           for="easy">
	                        Easy
	                    </label>
	                </div>
	
	            </div>
	
	        </div>
	
	        <!-- 学習状況 -->
	        <div class="col-md-4">
	
	            <label class="form-label fw-bold">
	                学習状況
	            </label>
	
	            <select class="form-select"
	                    id="studyCondition"
	                    name="studyCondition">
	
	                <option value="ALL"
	                        th:selected="${selectedStudyCondition == null or selectedStudyCondition.name() == 'ALL'}">
	                    すべて
	                </option>
	
	                <option value="LEARNED_ONLY"
	                        th:selected="${selectedStudyCondition != null and selectedStudyCondition.name() == 'LEARNED_ONLY'}">
	                    学習済み
	                </option>
	
	                <option value="UNLEARNED_ONLY"
	                        th:selected="${selectedStudyCondition != null and selectedStudyCondition.name() == 'UNLEARNED_ONLY'}">
	                    未学習
	                </option>
	
	            </select>
	
	        </div>
	
	        <!-- お気に入り -->
	        <div class="col-md-4">
	
	            <label class="form-label fw-bold">
	                お気に入り
	            </label>
	
	            <select class="form-select"
	                    name="favoriteCondition">
	
	                <option value="ALL"
	                        th:selected="${selectedFavoriteCondition == null or selectedFavoriteCondition.name() == 'ALL'}">
	                    すべて
	                </option>
	
	                <option value="FAVORITED"
	                        th:selected="${selectedFavoriteCondition != null and selectedFavoriteCondition.name() == 'FAVORITED'}">
	                    お気に入りのみ
	                </option>
	
	                <option value="NOT_FAVORITED"
	                        th:selected="${selectedFavoriteCondition != null and selectedFavoriteCondition.name() == 'NOT_FAVORITED'}">
	                    お気に入り以外
	                </option>
	
	            </select>
	
	        </div>
	
	        <!-- 条件 -->
	        <div class="col-md-4">
	
	            <label class="form-label fw-bold">
	                条件
	            </label>
	
	            <select class="form-select"
	                    name="conditions">
	
	                <option value="">
	                    すべて
	                </option>
	
	                <option th:each="condition : ${conditions}"
	                        th:value="${condition}"
	                        th:text="${condition}"
	                        th:selected="${selectedConditions != null and selectedConditions.contains(condition)}">
	                </option>
	
	            </select>
	
	        </div>
	
	        <!-- キーワード -->
	        <div class="col-md-9">
	
	            <label class="form-label fw-bold">
	                キーワード
	            </label>
	
	            <input class="form-control"
	                   type="text"
	                   name="keyword"
	                   placeholder="日本語・英語・別解"
	                   th:value="${keyword}">
	
	        </div>
	
	        <!-- ボタン -->
	        <div class="col-md-3 d-grid">
	
	            <button class="btn btn-primary"
	                    type="submit">
	
	                <i class="bi bi-search"></i>
	
	                検索
	
	            </button>
	
	        </div>
	
	    </div>
	
	</form>

	<table class="table table-hover align-middle">
	
	    <thead class="table-dark">
	
	    <tr>
	        <th>問題番号</th>
		    <th style="width:30%;">日本語</th>
		    <th style="width:30%;">英語</th>
	        <th>難易度</th>
	        <th>詳細</th>
	        <th>理解度</th>
	        <th>お気に入り</th>
	    </tr>
	
	    </thead>
	
	    <tbody>
	
	    <tr th:each="question : ${questionList}">
	
	        <!-- 問題番号 -->
	        <td th:text="${question.questionId}">
	        </td>
	
	        <!-- 日本語 -->
	        <td th:text="${question.japaneseText}">
	        </td>
	
	        <!-- 英語 -->
	        <td th:text="${question.englishText}">
	        </td>
	
	        <!-- 難易度 -->
	        <td>
	
	            <span class="text-danger fw-bold"
	                  th:if="${question.difficulty.name() == 'BEGINNER'}">
	                初級
	            </span>
	
	            <span class="text-primary fw-bold"
	                  th:if="${question.difficulty.name() == 'INTERMEDIATE'}">
	                中級
	            </span>
	
	            <span class="text-success fw-bold"
	                  th:if="${question.difficulty.name() == 'ADVANCED'}">
	                上級
	            </span>
	
	        </td>
	
	        <!-- 詳細 -->
	        <td>
	
				<button type="button"
				        class="detailButton btn btn-outline-primary btn-sm"
				        data-bs-toggle="modal"
				        data-bs-target="#questionDetailModal"
				        th:data-japanese="${question.japaneseText}"
				        th:data-english="${question.englishText}"
				        th:data-alternative="${question.alternativeAnswer}">
				    詳細
				</button>
	
	        </td>
	
			<!-- 理解度 -->
			<td>
			
			    <!-- 未学習 -->
			    <span th:if="${question.evaluation == null}"
			          class="text-secondary">
			        未学習
			    </span>
			
			    <!-- Hard -->
				<button
				    th:if="${question.evaluation == T(com.example.demo.entity.Evaluation).HARD}"
				    class="btn btn-sm btn-danger evaluationButton"
				    th:data-question-id="${question.questionId}"
				    data-bs-toggle="modal"
				    data-bs-target="#evaluationModal">
				    Hard
				</button>
			
			    <!-- Good -->
				<button
				    th:if="${question.evaluation == T(com.example.demo.entity.Evaluation).GOOD}"
				    class="btn btn-sm btn-primary evaluationButton"
				    th:data-question-id="${question.questionId}"
				    data-bs-toggle="modal"
				    data-bs-target="#evaluationModal">
				    Good
				</button>
			
			    <!-- Easy -->
				<button
				    th:if="${question.evaluation == T(com.example.demo.entity.Evaluation).EASY}"
				    class="btn btn-sm btn-success evaluationButton"
				    th:data-question-id="${question.questionId}"
				    data-bs-toggle="modal"
				    data-bs-target="#evaluationModal">
				    Easy
				</button>
			
			</td>
	
	        <!-- お気に入り -->
	        <td class="text-center">
	
	            <button class="btn btn-link p-0 favoriteButton"
	                    th:data-question-id="${question.questionId}">
	
	                <i class="bi bi-heart-fill text-danger"
	                   th:if="${question.favorite}">
	                </i>
	
	                <i class="bi bi-heart"
	                   th:unless="${question.favorite}">
	                </i>
	
	            </button>
	
	        </td>
	
	    </tr>
	
	    </tbody>
	
	</table>

	<!-- ページネーション -->
	<nav class="mt-4">
	
	    <ul class="pagination justify-content-center">
	
	        <!-- 前へ -->
	        <li class="page-item"
	            th:classappend="${page.first} ? ' disabled'">
	
	            <a class="page-link"
	               th:href="@{/user/question/search(
	                    page=${page.number-1},
	                    size=${page.size},
	                    difficulties=${selectedDifficulties},
	                    studyCondition=${selectedStudyCondition},
	                    favoriteCondition=${selectedFavoriteCondition},
	                    conditions=${selectedConditions},
	                    keyword=${keyword}
	               )}">
	
	                前へ
	
	            </a>
	
	        </li>
	
	        <!-- 1ページ目 -->
	        <li class="page-item"
	            th:classappend="${page.number == 0} ? ' active'">
	
	            <a class="page-link"
	               th:href="@{/user/question/search(
	                    page=0,
	                    size=${page.size},
	                    difficulties=${selectedDifficulties},
	                    studyCondition=${selectedStudyCondition},
	                    favoriteCondition=${selectedFavoriteCondition},
	                    conditions=${selectedConditions},
	                    keyword=${keyword}
	               )}">
	
	                1
	
	            </a>
	
	        </li>
	
	        <!-- ... (先頭側) -->
	        <li class="page-item disabled"
	            th:if="${pagination.showFirstEllipsis}">
	
	            <span class="page-link">...</span>
	
	        </li>
	
	        <!-- 中央のページ番号 -->
	        <li class="page-item"
	            th:each="i : ${#numbers.sequence(pagination.displayStartPage, pagination.displayEndPage)}"
	            th:if="${i != 0 and i != page.totalPages - 1}"
	            th:classappend="${i == pagination.currentPage} ? ' active'">
	
	            <a class="page-link"
	               th:href="@{/user/question/search(
	                    page=${i},
	                    size=${page.size},
	                    difficulties=${selectedDifficulties},
	                    studyCondition=${selectedStudyCondition},
	                    favoriteCondition=${selectedFavoriteCondition},
	                    conditions=${selectedConditions},
	                    keyword=${keyword}
	               )}"
	               th:text="${i + 1}">
	
	            </a>
	
	        </li>
	
	        <!-- ... (末尾側) -->
	        <li class="page-item disabled"
	            th:if="${pagination.showLastEllipsis}">
	
	            <span class="page-link">...</span>
	
	        </li>
	
	        <!-- 最終ページ -->
	        <li class="page-item"
	            th:if="${page.totalPages > 1}"
	            th:classappend="${page.last} ? ' active'">
	
	            <a class="page-link"
	               th:href="@{/user/question/search(
	                    page=${page.totalPages-1},
	                    size=${page.size},
	                    difficulties=${selectedDifficulties},
	                    studyCondition=${selectedStudyCondition},
	                    favoriteCondition=${selectedFavoriteCondition},
	                    conditions=${selectedConditions},
	                    keyword=${keyword}
	               )}"
	               th:text="${page.totalPages}">
	
	            </a>
	
	        </li>
	
	        <!-- 次へ -->
	        <li class="page-item"
	            th:classappend="${page.last} ? ' disabled'">
	
	            <a class="page-link"
	               th:href="@{/user/question/search(
	                    page=${page.number+1},
	                    size=${page.size},
	                    difficulties=${selectedDifficulties},
	                    studyCondition=${selectedStudyCondition},
	                    favoriteCondition=${selectedFavoriteCondition},
	                    conditions=${selectedConditions},
	                    keyword=${keyword}
	               )}">
	
	                次へ
	
	            </a>
	
	        </li>
	
	    </ul>
	
	</nav>
	
	<!-- モーダル -->
	<!-- 問題詳細モーダル -->
	<div class="modal fade"
	     id="questionDetailModal">
	
	    <div class="modal-dialog">
	
	        <div class="modal-content">
	
	            <div class="modal-header">
	                <h5 class="modal-title">問題詳細</h5>
	
	                <button type="button"
	                        class="btn-close"
	                        data-bs-dismiss="modal">
	                </button>
	            </div>
	
	            <div class="modal-body">
	
	                <p>
	                    <strong>日本語</strong><br>
	                    <span id="modalJapanese"></span>
	                </p>
	
	                <p>
	                    <strong>英語</strong><br>
	                    <span id="modalEnglish"></span>
	                </p>
	
	                <p id="modalAlternativeArea">
	                    <strong>別解</strong><br>
	                    <span id="modalAlternative"></span>
	                </p>
	
	            </div>
	
	            <div class="modal-footer">
	
	                <button type="button"
	                        class="btn btn-secondary"
	                        data-bs-dismiss="modal">
	
	                    閉じる
	
	                </button>
	
	            </div>
	
	        </div>
	
	    </div>
	
	</div>
	
	<!-- 理解度変更モーダル -->
	<div class="modal fade"
	     id="evaluationModal">
	
	    <div class="modal-dialog">
	
	        <div class="modal-content">
	
	            <div class="modal-header">
	
	                <h5 class="modal-title">
	                    理解度変更
	                </h5>
	
	                <button type="button"
	                        class="btn-close"
	                        data-bs-dismiss="modal">
	                </button>
	
	            </div>
	
	            <div class="modal-body text-center">
	
	                <button class="btn btn-danger evaluationSelect"
	                        data-evaluation="HARD">
	                    Hard
	                </button>
	
	                <button class="btn btn-primary evaluationSelect"
	                        data-evaluation="GOOD">
	                    Good
	                </button>
	
	                <button class="btn btn-success evaluationSelect"
	                        data-evaluation="EASY">
	                    Easy
	                </button>
	
	            </div>
	
	        </div>
	
	    </div>
	
	</div>

</div>



</body>

</html>
