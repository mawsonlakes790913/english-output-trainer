<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>English Output Trainer</title>
    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
	<div layout:fragment="content" class="container pt-3">
    <h2>ユーザーメニュー</h2>
	    <div class="list-group mt-3">
	        <a th:href="@{/user/question/search}" class="list-group-item list-group-item-action">
				<i class="bi bi-list-ul me-2"></i>
	            問題一覧・検索
	        </a>	                	        
	        <a th:href="@{/user/profile}" class="list-group-item list-group-item-action">
				<i class="bi bi-person-fill me-2"></i>
	            会員情報確認・編集
	        </a>
	        <a th:href="@{/admin}" 
	           class="list-group-item list-group-item-action"
	           sec:authorize="hasRole('ROLE_ADMIN')">
				<i class="bi bi-shield-lock-fill me-2"></i>
	            アドミン権限専用画面
	        </a>
	    </div>
	</div>
</body>
